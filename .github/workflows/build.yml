name: Build KernelSU for Redmi 6 (10-alps)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: 10-alps

      - name: Install Dependencies & Compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc libncurses5-dev libssl-dev bison flex libelf-dev clang lld llvm git curl gcc-aarch64-linux-gnu

      - name: Inject KernelSU
        run: |
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s main

      - name: Build Kernel Image
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-

          # Hanapin ang tamang defconfig para sa alps branch
          if [ -f arch/arm64/configs/cereus_defconfig ]; then
            DEFCONFIG="cereus_defconfig"
          elif [ -f arch/arm64/configs/cactus_defconfig ]; then
            DEFCONFIG="cactus_defconfig"
          else
            DEFCONFIG=$(ls arch/arm64/configs/ | grep -iE 'cereus|cactus|mt6765' | head -n 1)
          fi

          echo "Gagamiting Config: $DEFCONFIG"
          make O=out $DEFCONFIG
          echo "CONFIG_KSU=y" >> out/.config
          make -j$(nproc) O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu-

      - name: Upload Boot Image Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KSU-Kernel-cereus-alps
          path: out/arch/arm64/boot/Image.gz-dtb
