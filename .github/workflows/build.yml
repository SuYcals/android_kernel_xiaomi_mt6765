name: Build KernelSU for Redmi 6 (10-alps)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: 10-alps

      - name: Install Dependencies & Compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc libncurses5-dev libssl-dev bison flex libelf-dev clang lld llvm git curl gcc-aarch64-linux-gnu

      - name: Inject KernelSU
        run: |
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s main

      - name: Build Kernel Image
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-

          mkdir -p out

          # Direktang kunin at kopyahin ang unang defconfig file sa folder
          CONFIG_FILE=$(find arch/arm64/configs -maxdepth 1 -name "*_defconfig" | head -n 1)
          cp "$CONFIG_FILE" out/.config

          # Paganahin ang KernelSU
          echo "CONFIG_KSU=y" >> out/.config

          # I-run ang olddefconfig at simulan ang compilation
          make O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- olddefconfig HOSTCFLAGS="-Wno-error=dangling-pointer"
          make -j$(nproc) O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- KCFLAGS="-w -Wno-error=array-compare -Wno-error=int-conversion"

      - name: Upload Boot Image Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KSU-Kernel-cereus-alps
          path: out/arch/arm64/boot/Image.gz-dtb
