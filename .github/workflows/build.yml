name: Build KernelSU for Redmi 6 (10-alps)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: 10-alps

      - name: Install Dependencies & Compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc libncurses5-dev libssl-dev bison flex libelf-dev clang lld llvm git curl gcc-aarch64-linux-gnu

      - name: Inject KernelSU
        run: |
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s main

      - name: Build Kernel Image
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-

          mkdir -p out

          # Kopyahin ang tamang defconfig patungo sa out/.config
          if [ -f arch/arm64/configs/cereus_defconfig ]; then
            cp arch/arm64/configs/cereus_defconfig out/.config
          elif [ -f arch/arm64/configs/cactus_defconfig ]; then
            cp arch/arm64/configs/cactus_defconfig out/.config
          elif [ -f arch/arm64/configs/lotus_defconfig ]; then
            cp arch/arm64/configs/lotus_defconfig out/.config
          else
            CONFIG_FILE=$(find arch/arm64/configs -maxdepth 1 -name "*_defconfig" | head -n 1)
            cp "$CONFIG_FILE" out/.config
          end

          # Paganahin ang KernelSU
          echo "CONFIG_KSU=y" >> out/.config

          # I-run ang olddefconfig
          make O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- olddefconfig HOSTCFLAGS="-Wno-error=dangling-pointer"

          # I-compile nang may karagdagang flag para i-bypass ang array-compare at int-conversion errors sa lumang code
          make -j$(nproc) O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- KCFLAGS="-w -Wno-error=array-compare -Wno-error=int-conversion -Wno-error=misleading-indentation"

      - name: Upload Boot Image Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KSU-Kernel-cereus-alps
          path: out/arch/arm64/boot/Image.gz-dtb
